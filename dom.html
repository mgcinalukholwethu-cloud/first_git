<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Magical Spell Generator</title>
  <style>
    body {
      font-family: 'Papyrus', fantasy;
      background-color: #0389ff;
      text-align: center;
      padding: 30px;
    }
    #spellArea {
      margin-top: 20px;
      padding: 20px;
      border: 2px dashed #333;
      min-height: 50px;
      font-size: 1.5em;
      transition: background-color 0.5s ease;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <h1>Welcome to the Magical Spell Generator!</h1>

  <div id="spellArea">✨ Your spell will appear here ✨</div>

  <button id="generateButton">Generate Spell</button>
  <button id="resetButton">Reset</button>

  <ul id="ingredientsList">
    <li>Dragon Scale</li>
    <li>Phoenix Feather</li>
    <li>Unicorn Horn</li>
  </ul>

  <script>
    const generateButton = document.getElementById('generateButton');
    const resetButton = document.getElementById('resetButton');
    const spellArea = document.getElementById('spellArea');
    const ingredientsList = document.querySelectorAll('#ingredientsList li');

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function generateSpell() {
      let countdown = 3;
      spellArea.textContent = `Spell casting in ${countdown}...`;

      const interval = setInterval(() => {
        countdown--;
        if (countdown > 0) {
          spellArea.textContent = `Spell casting in ${countdown}...`;
        } else {
          clearInterval(interval);
          const randomIndex = Math.floor(Math.random() * ingredientsList.length);
          const ingredient = ingredientsList[randomIndex].textContent;
          spellArea.textContent = `🪄 You conjured a spell with: ${ingredient}!`;
          spellArea.style.backgroundColor = getRandomColor();
        }
      }, 1000);
    }

    function resetSpell() {
      spellArea.textContent = '✨ Your spell will appear here ✨';
      spellArea.style.backgroundColor = '#f0f8ff';
    }

    generateButton.addEventListener('click', generateSpell);
    resetButton.addEventListener('click', resetSpell);
  </script>
</body>
</html>
